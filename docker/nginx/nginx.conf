
log_format upstream_timing
    '$remote_addr "$request" '
    'status=$status '
    'request_time=$request_time '
    'upstream_addr=$upstream_addr '
    'upstream_status=$upstream_status '
    'upstream_response_time=$upstream_response_time';
access_log /dev/stdout upstream_timing;

upstream api_backend {
       # كلفة الطلبات غير متساوية؛ least_conn يوزع العمل حسب الاتصالات النشطة.
    # ip_hash يثقل نسخة واحدة مع زبائن خلف NAT، وينقل زبائنها دفعة واحدة عند سقوطها، ويخفي مشاكل الحالة المحلية؛ النظام stateless.

    least_conn;
    server backend-1:3000 max_fails=3 fail_timeout=5s;
    server backend-2:3000 max_fails=3 fail_timeout=5s;
    server backend-3:3000 max_fails=3 fail_timeout=5s;
    
}


server {
    listen 80;
    client_max_body_size 3m;
    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_connect_timeout 1s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
        add_header X-Upstream $upstream_addr always;
    }
   
}
