services:
  db:
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=256MB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/replication-role.sql:/scripts/replication-role.sql:ro

  backend:
    environment:
      PRODUCTS_READ_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@read-replica:5432/${DB_NAME:-ecommerce_db}?schema=products&connection_limit=5&application_name=backend-products-read-replica"
      ORDERS_READ_DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@read-replica:5432/${DB_NAME:-ecommerce_db}?schema=orders&connection_limit=5&application_name=backend-orders-read-replica"

  read-replica:
    image: postgres:16-alpine
    profiles: ["replica"]
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      REPLICATION_USER: perf_replica
      PERF_REPLICATION_PASSWORD: ${PERF_REPLICATION_PASSWORD:?Set PERF_REPLICATION_PASSWORD in .env or the shell environment}
    entrypoint: ["/bin/sh", "/opt/replica-entrypoint.sh"]
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./scripts/postgres-replica-entrypoint.sh:/opt/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atc 'SELECT pg_is_in_recovery()')" = "t"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_replica_data:
