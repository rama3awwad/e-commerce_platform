version: '3.8'

services:
  # ========== PostgreSQL Database ==========
  db:
    image: postgres:16-alpine
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ========== pgAdmin (Database Management) ==========
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@store.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ========== Backend API ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ecommerce_db?schema=public"
      JWT_SECRET: "change-this-to-a-secure-secret-in-production"
      JWT_EXPIRATION: "1d"
      PORT: 3000
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 10
      ACCOUNT_LOCKOUT_ATTEMPTS: 5
      ACCOUNT_LOCKOUT_DURATION_MINUTES: 15
      CORS_ORIGIN: "http://localhost:3001,http://localhost:4200"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
